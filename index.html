<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>あまなつちゃんタロット占い</title>
  <meta name="description" content="13枚のカードで運勢を読み解く、ホロスコープ・スプレッドのタロット占い。">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 言語の切り替え -->
  <div class="lang-switch">
    <label for="lang-select" id="lang-label">言語</label>
    <select id="lang-select"></select>
  </div>

  <header class="site-header">
    <p class="sub">✦ Amanatsu Tarot ✦</p>
    <h1><span data-i18n="h1.0">あまなつちゃん</span><br class="sp"><span data-i18n="h1.1">タロット占い</span></h1>
  </header>

  <main>
    <!-- カードの配置 -->
    <section id="spread-view">
      <p class="lead"><span data-i18n="lead.0"></span><br><span data-i18n="lead.1"></span></p>
      <p id="progress" class="progress"></p>
      <div id="board" class="board"></div>
    </section>

    <!-- 結果 -->
    <section id="result-view" hidden>
      <button type="button" class="back-btn" data-back data-i18n="backLink"></button>

      <div class="position-head">
        <p class="position-no"></p>
        <h2 class="position-name"></h2>
        <p class="position-desc"></p>
      </div>

      <button type="button" id="result-card" class="result-card">
        <img id="result-img" alt="">
      </button>

      <div class="card-title">
        <p class="card-en"></p>
        <h3><span class="card-roman"></span> <span class="card-name"></span> <span class="orientation"></span></h3>
      </div>

      <p class="specific-text"></p>

      <article class="reading general">
        <h4><span data-i18n="meaningHead"></span><span class="keywords"></span></h4>
        <p class="general-text"></p>
      </article>

      <button type="button" class="primary" data-back data-i18n="backButton"></button>
    </section>
  </main>

  <!-- カードの拡大表示 -->
  <button type="button" id="zoom" class="zoom" hidden>
    <img id="zoom-img" alt="">
  </button>

  <footer class="site-footer">
    <p data-i18n="footer"></p>
  </footer>

  <script src="js/cards.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/lang/ja.js"></script>
  <script src="js/lang/en.js"></script>
  <script src="js/lang/zh-Hans.js"></script>
  <script src="js/lang/zh-Hant.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
