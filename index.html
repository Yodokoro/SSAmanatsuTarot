<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>あまなつちゃんタロット占い</title>
  <meta name="description" content="13枚のカードで運勢を読み解く、ホロスコープ・スプレッドのタロット占い。">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <p class="sub">✦ Amanatsu Tarot ✦</p>
    <h1>あまなつちゃん<br class="sp">タロット占い</h1>
  </header>

  <main>
    <!-- カードの配置 -->
    <section id="spread-view">
      <p class="lead">13枚のカードが、あなたの運勢を12の項目と「鍵」で教えてくれます。<br>気になる項目のカードをタップしてめくってね。</p>
      <p id="progress" class="progress"></p>
      <div id="board" class="board"></div>
    </section>

    <!-- 結果 -->
    <section id="result-view" hidden>
      <button type="button" class="back-btn" data-back>← カードの配置に戻る</button>

      <div class="position-head">
        <p class="position-no"></p>
        <h2 class="position-name"></h2>
        <p class="position-desc"></p>
      </div>

      <button type="button" id="result-card" class="result-card" aria-label="カードを拡大する">
        <img id="result-img" alt="">
      </button>

      <div class="card-title">
        <p class="card-en"></p>
        <h3><span class="card-roman"></span> <span class="card-name"></span> <span class="orientation"></span></h3>
      </div>

      <p class="specific-text"></p>

      <article class="reading general">
        <h4>カードの意味:<span class="keywords"></span></h4>
        <p class="general-text"></p>
      </article>

      <button type="button" class="primary" data-back>カードの配置に戻る</button>
    </section>
  </main>

  <!-- カードの拡大表示 -->
  <button type="button" id="zoom" class="zoom" aria-label="拡大表示を閉じる" hidden>
    <img id="zoom-img" alt="">
  </button>

  <footer class="site-footer">
    <p>占いの結果は楽しむためのものです。ページを再読み込みすると、カードが新しく配られます。</p>
  </footer>

  <script src="js/cards.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
