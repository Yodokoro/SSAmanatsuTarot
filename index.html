<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>あまなつちゃんタロット占い</title>
  <meta name="description" content="伏せられたカードから1枚選んでめくる、かんたんタロット占い。">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <p class="sub">✦ Amanatsu Tarot ✦</p>
    <h1>あまなつちゃん<br class="sp">タロット占い</h1>
  </header>

  <main>
    <!-- 1. はじめ -->
    <section id="start" class="panel">
      <p class="lead">心を落ち着けて、知りたいことを思い浮かべてね。<br>準備ができたらカードをシャッフルします。</p>
      <label class="question">
        <span>占いたいこと(なくてもOK)</span>
        <input id="question" type="text" maxlength="60" placeholder="例:今週の仕事運は?">
      </label>
      <button type="button" id="start-btn" class="primary">カードをシャッフルする</button>
    </section>

    <!-- 2. カードを選ぶ -->
    <section id="pick" hidden>
      <p class="shown-question" hidden></p>
      <p class="hint">気になるカードを1枚えらんでね</p>
      <div id="deck" class="deck"></div>
    </section>

    <!-- 3. 結果 -->
    <section id="result" hidden>
      <p class="shown-question" hidden></p>
      <div class="chosen-wrap">
        <div id="chosen-card" class="card">
          <div class="card-inner">
            <div class="face back"><span class="back-mark" aria-hidden="true">✦</span></div>
            <div class="face front"><img id="chosen-img" alt=""></div>
          </div>
        </div>
      </div>
      <article id="result-body" class="result" aria-live="polite" hidden>
        <h2><span class="roman"></span> <span class="name"></span> <span class="orientation"></span></h2>
        <p class="en"></p>
        <p class="meaning"></p>
      </article>
      <button type="button" id="retry" class="primary">もう一度占う</button>
    </section>
  </main>

  <footer class="site-footer">
    <p>占いの結果は楽しむためのものです。</p>
  </footer>

  <script src="js/cards.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
